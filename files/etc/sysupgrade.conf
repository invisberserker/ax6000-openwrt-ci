# Preserve proxy configuration across sysupgrade with "Keep settings".
# OpenClash's Makefile has empty conffiles, so /etc/config/openclash is not
# otherwise protected. The baked core is not preserved: a new image restores
# the pinned mihomo version.
/etc/config/openclash
/etc/openclash/custom/
/etc/openclash/overwrite/
/etc/config/shadowsocksr
/etc/ssrplus/
/etc/config/proxy_switch
