name: Build lede for Redmi AX6000

on:
  workflow_dispatch:
    inputs:
      lede_ref:
        description: "lede commit/branch to build (default: master)"
        required: false
        default: "master"

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  LEDE_REF: ${{ github.event.inputs.lede_ref || 'master' }}
  CONFIG_FILE: configs/ax6000.seed
  TZ: Asia/Shanghai
  MIHOMO_VERSION: v1.19.34
  MIHOMO_SHA256: daaf78a6240a282cdfd75bcbf98fe321f6bd52765cc29e79f344191198f0b50f

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/miniconda /usr/lib/jvm \
            /usr/local/lib/node_modules /opt/microsoft /usr/local/aws-cli \
            /usr/local/share/powershell /usr/share/az_* 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "${avail:-0}" -lt 25 ]; then
            echo "Only ${avail}G free on /; need at least 25G" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils clang flex bison gawk gettext intltool \
            autoconf automake autopoint libtool cmake ninja-build pkgconf \
            libncurses-dev libssl-dev libelf-dev zlib1g-dev \
            liblzma-dev libbz2-dev libzstd-dev libyaml-dev libreadline-dev \
            libgmp-dev libffi-dev libpcre2-dev libglib2.0-dev libltdl-dev \
            libmpc-dev libmpfr-dev libpython3-dev \
            python3 python3-setuptools python3-pip python3-wheel python3-ply \
            python3-pyelftools p7zip-full \
            device-tree-compiler bc cpio patch rsync swig squashfs-tools \
            xz-utils zstd bzip2 unzip file wget curl git subversion ccache \
            jq xxd texinfo gperf re2c

      - name: Clone lede
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3; do
            if git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt; then
              ok=1
              break
            fi
            rm -rf openwrt
            sleep 15
          done
          [ "$ok" -eq 1 ] || { echo "lede clone failed" >&2; exit 1; }
          if [ "${LEDE_REF:-master}" != "$REPO_BRANCH" ]; then
            git -C openwrt fetch --depth 1 origin "$LEDE_REF"
            git -C openwrt checkout --detach FETCH_HEAD
          fi
          git -C openwrt log -1 --format='- lede @ %h (%cd)' --date=short >> "$GITHUB_STEP_SUMMARY"
          df -h .

      - name: Verify host prerequisites
        working-directory: openwrt
        # Run the check target directly: `make prereq` depends on .config and,
        # on a fresh clone, would launch the interactive ncurses menuconfig.
        run: |
          set -euo pipefail
          mkdir -p tmp
          make -r -s -j1 -f include/prereq-build.mk TOPDIR="$PWD" prereq

      - name: Patch default-settings password guard
        run: |
          chmod +x scripts/patch-default-settings.sh
          ./scripts/patch-default-settings.sh openwrt

      - name: Install repository overlay
        run: |
          set -euo pipefail
          mkdir -p openwrt/files
          cp -a files/. openwrt/files/
          cp configs/feeds.conf openwrt/feeds.conf
          find openwrt/files -type f -print

      - name: Cache download cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ hashFiles('configs/ax6000.seed') }}-${{ github.run_id }}
          restore-keys: |
            dl-

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3; do
            if ./scripts/feeds update -a; then
              ok=1
              break
            fi
            sleep 15
          done
          [ "$ok" -eq 1 ] || { echo "feeds update failed" >&2; exit 1; }
          ./scripts/feeds install -a

      - name: Bake mihomo (clash_meta) core
        working-directory: openwrt
        run: |
          set -euo pipefail
          mkdir -p files/etc/openclash/core
          curl --retry 5 --retry-delay 5 -fsSL \
            -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-arm64-${MIHOMO_VERSION}.gz"
          echo "${MIHOMO_SHA256}  /tmp/mihomo.gz" | sha256sum -c -
          gzip -t /tmp/mihomo.gz
          gunzip -c /tmp/mihomo.gz > files/etc/openclash/core/clash_meta
          chmod 755 files/etc/openclash/core/clash_meta
          file files/etc/openclash/core/clash_meta | tee /tmp/mihomo.file
          grep -q 'ELF 64-bit LSB executable, ARM aarch64' /tmp/mihomo.file
          ls -lh files/etc/openclash/core/clash_meta
          echo "- mihomo ${MIHOMO_VERSION} baked uncompressed at /etc/openclash/core/clash_meta" >> "$GITHUB_STEP_SUMMARY"

      - name: Load and verify config
        working-directory: openwrt
        run: |
          set -euo pipefail
          cp "../${CONFIG_FILE}" .config
          make defconfig
          ./scripts/diffconfig.sh | tee diffconfig.txt
          ../scripts/verify-config.sh .config
          echo "::group::key config lines"
          grep -E 'CONFIG_TARGET_mediatek_filogic_DEVICE|dnsmasq|ssr-plus|openclash|wpad|xray|htpdate|zram|package-manager' .config || true
          echo "::endgroup::"

      - name: Record source versions
        run: |
          set -euo pipefail
          {
            echo "generated_at=$(date -u +%FT%TZ)"
            echo "repo=$(git rev-parse HEAD)"
            echo "lede_ref=${LEDE_REF}"
            echo "lede=$(git -C openwrt rev-parse HEAD)"
            for d in openwrt/feeds/*; do
              if [ -d "$d/.git" ]; then
                echo "feed.$(basename "$d")=$(git -C "$d" rev-parse HEAD)"
              fi
            done
            echo "mihomo_version=${MIHOMO_VERSION}"
            echo "mihomo_sha256=${MIHOMO_SHA256}"
            echo "config_sha256=$(sha256sum "${CONFIG_FILE}" | awk '{print $1}')"
            echo "resolved_config_sha256=$(sha256sum openwrt/.config | awk '{print $1}')"
          } | tee openwrt/sources.lock

      - name: Download sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3; do
            if make download -j"$(nproc)"; then
              ok=1
              break
            fi
            sleep 15
          done
          [ "$ok" -eq 1 ] || { echo "make download failed" >&2; exit 1; }

      - name: Compile
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log
          echo "::group::built images"
          ls -lh bin/targets/mediatek/filogic/ || true
          echo "::endgroup::"

      - name: Verify image and manifest
        working-directory: openwrt
        run: |
          set -euo pipefail
          ../scripts/verify-manifest.sh bin/targets/mediatek/filogic
          cp diffconfig.txt bin/targets/mediatek/filogic/
          ls -lh bin/targets/mediatek/filogic/*sysupgrade* bin/targets/mediatek/filogic/SHA256SUMS

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax6000-firmware-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            openwrt/bin/targets/mediatek/filogic/
            openwrt/build.log
            openwrt/sources.lock
            openwrt/diffconfig.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Publish firmware release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="fw-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "AX6000 firmware ${GITHUB_RUN_NUMBER}" \
            --notes "lede $(git -C openwrt rev-parse --short HEAD); mihomo ${MIHOMO_VERSION}; kernel follows lede master." \
            openwrt/bin/targets/mediatek/filogic/*sysupgrade*.bin \
            openwrt/bin/targets/mediatek/filogic/*.manifest \
            openwrt/bin/targets/mediatek/filogic/SHA256SUMS \
            openwrt/sources.lock \
            openwrt/diffconfig.txt \
            openwrt/build.log

      - name: Upload logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ax6000-build-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            openwrt/build.log
            openwrt/sources.lock
            openwrt/.config
            openwrt/diffconfig.txt
            openwrt/logs/
          if-no-files-found: ignore
          retention-days: 14
